<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ページが見つかりません｜もみかる</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F8F8F5;color:#1A1A2E;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:480px;padding:48px 16px;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.code{font-family:"Roboto Mono",ui-monospace,monospace;font-weight:700;font-size:12px;letter-spacing:0.2em;color:#A87A00}
h1{margin:0;font-size:22px;line-height:1.5}
p{margin:0;font-size:14px;line-height:1.85;color:#4A4A5E}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;background:#F5B800;color:#1A1A2E;font-weight:700;font-size:14px;text-decoration:none}
a:hover{background:#FFC933}
</style>
</head>
<body>
<main>
  <span class="code">404 NOT FOUND</span>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは、移動または削除された可能性があります。</p>
  <a href="/">トップへ戻る</a>
</main>
</body>
</html>
